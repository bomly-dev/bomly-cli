# Stage 3 of Bomly's release assurance framework: the exhaustive pass, run
# against the binaries users actually download. It cannot change the release —
# published releases are immutable — so its job is to measure and to publish an
# honest report, and to open a tracking issue when something is wrong.
#
# The report it writes (docs/assurance/reports/<tag>.json) plus the index beside
# it are the only data source for bomly.dev/assurance.
name: Release assessment

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to assess, such as v0.24.0.
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: release-assessment-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve the release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      commit: ${{ steps.release.outputs.commit }}
      url: ${{ steps.release.outputs.url }}
      published_at: ${{ steps.release.outputs.published_at }}
    steps:
      - name: Look up the release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}")"
          published_at="$(echo "${release_json}" | jq -r '.published_at // ""')"
          url="$(echo "${release_json}" | jq -r '.html_url')"
          draft="$(echo "${release_json}" | jq -r '.draft')"
          if [ "${draft}" = "true" ]; then
            echo "::error::${TAG} is still a draft. The assessment describes published releases."
            exit 1
          fi
          commit="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${TAG}" --jq '.sha')"
          {
            echo "tag=${TAG}"
            echo "version=${TAG#v}"
            echo "commit=${commit}"
            echo "url=${url}"
            echo "published_at=${published_at}"
          } >> "${GITHUB_OUTPUT}"

  install-scripts:
    name: Install script (${{ matrix.platform.name }})
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: ubuntu
            os: ubuntu-latest
          - name: macos
            os: macos-latest
          - name: windows
            os: windows-latest
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 20
    steps:
      - name: Check out the released source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.tag }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Run the published install script
        id: install
        continue-on-error: true
        shell: bash
        env:
          BOMLY_VERSION: ${{ needs.resolve.outputs.tag }}
          BOMLY_INSTALL_DIR: ${{ runner.temp }}/bomly-install
        run: |
          set -euo pipefail
          mkdir -p "${BOMLY_INSTALL_DIR}"
          if [ "${RUNNER_OS}" = "Windows" ]; then
            pwsh -NoProfile -File scripts/install.ps1 \
              -Version "${BOMLY_VERSION}" -InstallDir "${BOMLY_INSTALL_DIR}"
            "${BOMLY_INSTALL_DIR}/bomly.exe" version | tee "${RUNNER_TEMP}/version.txt"
          else
            sh scripts/install.sh
            "${BOMLY_INSTALL_DIR}/bomly" version | tee "${RUNNER_TEMP}/version.txt"
          fi

      - name: Record the install result
        if: always()
        shell: bash
        env:
          BOMLY_ASSURANCE_TAG: ${{ needs.resolve.outputs.tag }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          exit_code=0
          reported="$(head -n 1 "${RUNNER_TEMP}/version.txt" 2>/dev/null || echo "")"
          summary="The published install script installed Bomly ${VERSION} on ${RUNNER_OS} and the binary reported: ${reported}"
          if [ "${INSTALL_OUTCOME}" != "success" ]; then
            exit_code=1
            summary="The published install script failed on ${RUNNER_OS}. Open the install step for the exact command that failed."
          elif ! printf '%s' "${reported}" | grep -q "${VERSION}"; then
            exit_code=1
            summary="The install script ran on ${RUNNER_OS} but the installed binary reported '${reported}' instead of ${VERSION}."
          fi
          go run ./internal/assurance/cmd emit \
            --id install-script --instance '${{ matrix.platform.name }}' \
            --exit-code "${exit_code}" --summary "${summary}" \
            --out assurance-results --step-summary

      - name: Upload check result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: assurance-install-${{ matrix.platform.name }}
          path: assurance-results
          if-no-files-found: error
          retention-days: 30

  public-download:
    name: Public download
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the released source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.tag }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      # Unauthenticated, from the public URL, exactly as a user would.
      - name: Download every published file
        id: download
        continue-on-error: true
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/assets"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/assets/SHA256SUMS" "${base}/SHA256SUMS"
          while read -r _ name; do
            name="${name#\*}"
            echo "downloading ${name}"
            curl -fsSL --retry 3 -o "${RUNNER_TEMP}/assets/${name}" "${base}/${name}"
          done < "${RUNNER_TEMP}/assets/SHA256SUMS"
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/assets/SHA256SUMS.sigstore.json" "${base}/SHA256SUMS.sigstore.json"
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/assets/multiple.intoto.jsonl" "${base}/multiple.intoto.jsonl"

      - name: Verify what a user would download
        id: verify
        continue-on-error: true
        env:
          BOMLY_ASSURANCE_TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          go run ./internal/assurance/cmd verify-release \
            --dir "${RUNNER_TEMP}/assets" --version '${{ needs.resolve.outputs.version }}' \
            --scope full --out "${RUNNER_TEMP}/release-results"

      - name: Record the public download result
        if: always()
        env:
          BOMLY_ASSURANCE_TAG: ${{ needs.resolve.outputs.tag }}
          DOWNLOAD_OUTCOME: ${{ steps.download.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          set -euo pipefail
          exit_code=0
          count="$(find "${RUNNER_TEMP}/assets" -type f | wc -l | tr -d ' ')"
          summary="All ${count} published files downloaded from their public URLs and match the published checksum list."
          if [ "${DOWNLOAD_OUTCOME}" != "success" ]; then
            exit_code=1
            summary="At least one published file could not be downloaded from its public URL."
          elif [ "${VERIFY_OUTCOME}" != "success" ]; then
            exit_code=1
            summary="The published files downloaded, but ${count} of them did not match the published checksum list."
          fi
          go run ./internal/assurance/cmd emit \
            --id public-download --exit-code "${exit_code}" --summary "${summary}" \
            --metric files="${count}" --out assurance-results --step-summary

      - name: Upload check result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: assurance-public-download
          path: assurance-results
          if-no-files-found: error
          retention-days: 30

  released-scan:
    name: Released binary scan (${{ matrix.slice.name }})
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        slice:
          - name: go
            run: 'TestScan$/scan-go$|TestDiff/diff-go|TestExplain/explain-go'
          - name: node
            run: 'TestScan$/scan-npm$'
          - name: sbom
            run: 'TestScan$/scan-sbom'
    steps:
      - name: Check out the released source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.tag }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Download the released binaries
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/release"
          gh release download "${TAG}" --repo "${GITHUB_REPOSITORY}" --dir "${RUNNER_TEMP}/release" \
            --pattern "bomly_${VERSION}_linux_amd64.tar.gz" \
            --pattern "bomly-lite_${VERSION}_linux_amd64.tar.gz" \
            --pattern SHA256SUMS
          (cd "${RUNNER_TEMP}/release" && sha256sum --check --ignore-missing SHA256SUMS)
          tar -xzf "${RUNNER_TEMP}/release/bomly_${VERSION}_linux_amd64.tar.gz" -C "${RUNNER_TEMP}/release" bomly
          tar -xzf "${RUNNER_TEMP}/release/bomly-lite_${VERSION}_linux_amd64.tar.gz" -C "${RUNNER_TEMP}/release" bomly-lite
          chmod +x "${RUNNER_TEMP}/release/bomly" "${RUNNER_TEMP}/release/bomly-lite"

      # The same golden files the source tree is checked against, driven by the
      # binary the release shipped.
      - name: Scan real projects with the released binary
        id: scan
        continue-on-error: true
        env:
          BOMLY_SMOKE_BINARY: ${{ runner.temp }}/release/bomly
          BOMLY_SMOKE_LITE_BINARY: ${{ runner.temp }}/release/bomly-lite
        run: |
          set -o pipefail
          go test -tags smoke ./test/smoke/ -json -count=1 -timeout 30m \
            -run '${{ matrix.slice.run }}' 2>&1 | tee "${RUNNER_TEMP}/scan.jsonl" > /dev/null

      - name: Record the scan result
        if: always()
        env:
          BOMLY_ASSURANCE_TAG: ${{ needs.resolve.outputs.tag }}
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
        run: |
          exit_code=0
          if [ "${SCAN_OUTCOME}" != "success" ]; then
            exit_code=1
          fi
          go run ./internal/assurance/cmd gotest \
            --id released-scan --instance '${{ matrix.slice.name }}' \
            --input "${RUNNER_TEMP}/scan.jsonl" --exit-code "${exit_code}" \
            --echo --out assurance-results --step-summary

      - name: Upload check result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: assurance-released-scan-${{ matrix.slice.name }}
          path: assurance-results
          if-no-files-found: error
          retention-days: 30

  sbom:
    name: SBOM interoperability
    needs: resolve
    uses: ./.github/workflows/sbom-interoperability.yml
    with:
      ref: ${{ needs.resolve.outputs.tag }}
      release_tag: ${{ needs.resolve.outputs.tag }}
      assurance: true

  perf-samples:
    name: Repeated scan timing
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the released source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.tag }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Download the released lite binary
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/release" bin
          gh release download "${TAG}" --repo "${GITHUB_REPOSITORY}" --dir "${RUNNER_TEMP}/release" \
            --pattern "bomly-lite_${VERSION}_linux_amd64.tar.gz" --pattern SHA256SUMS
          (cd "${RUNNER_TEMP}/release" && sha256sum --check --ignore-missing SHA256SUMS)
          tar -xzf "${RUNNER_TEMP}/release/bomly-lite_${VERSION}_linux_amd64.tar.gz" \
            -C "${RUNNER_TEMP}/release" bomly-lite
          install -m 0755 "${RUNNER_TEMP}/release/bomly-lite" bin/bomly-lite

      - name: Measure repeated scans
        id: perf
        continue-on-error: true
        run: |
          go run ./internal/assurance/perfrun -output .benchmark-runs/performance \
            -case canonical-sbom-scan -samples 5 -network-state offline -- \
            ./bin/bomly-lite scan --sbom --path test/smoke/testdata/sboms/go.spdx.json \
            --detectors sbom --format json

      - name: Record the timing result
        if: always()
        env:
          BOMLY_ASSURANCE_TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          manifest=".benchmark-runs/performance/run-manifest.json"
          if [ -f "${manifest}" ]; then
            go run ./internal/assurance/cmd convert benchmark-run \
              --id perf-samples --input "${manifest}" \
              --out assurance-results --step-summary
          else
            go run ./internal/assurance/cmd emit \
              --id perf-samples --status fail \
              --summary "The performance run stopped before it could write a manifest." \
              --out assurance-results --step-summary
          fi

      - name: Upload check result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: assurance-perf-samples
          path: assurance-results
          if-no-files-found: error
          retention-days: 30

  report:
    name: Publish the release report
    # always(), so a failed check still gets a published report — but only when
    # the release itself was resolved, since everything below needs its tag.
    if: always() && needs.resolve.result == 'success'
    needs: [resolve, install-scripts, public-download, released-scan, sbom, perf-samples]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Mint release bot token
        # Commits the report to main and dispatches to the landing page. The
        # same app already pushes the version-bump commits.
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: bomly-dev
          repositories: |
            bomly-cli
            bomly-landing-page
          permission-contents: write

      - name: Mint issue token
        # Issues is a newer grant on the release app than contents. Minting it
        # separately means an app that has not been granted it yet loses the
        # tracking issue, not the whole report.
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: issue-token
        continue-on-error: true
        with:
          client-id: ${{ vars.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: bomly-dev
          repositories: bomly-cli
          permission-issues: write

      - name: Check out main
        # The report is committed to main, and the report tooling comes from
        # main so a fix can be applied to an old release's report. The catalog,
        # though, must be the one the checks actually ran against — see below.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Collect this stage's check results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: assurance-*
          merge-multiple: true
          path: assurance-results

      # Stages 1 and 2 ran in other workflow runs. Their results are pulled in
      # so the report covers the whole release, and anything that cannot be
      # found stays absent — the report then shows those checks as missing
      # rather than pretending they passed.
      - name: Collect the earlier stages' check results
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
          COMMIT: ${{ needs.resolve.outputs.commit }}
        run: |
          set -uo pipefail
          parent="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${COMMIT}" --jq '.parents[0].sha // ""')"

          # A workflow called with `uses:` produces no run of its own — the
          # jobs live in the caller's run (Auto Version). So the search is over
          # every run for the commit, looking for the verdict job by name.
          find_verdict_run() {
            local sha="$1"
            [ -n "${sha}" ] || return 1
            local run_id
            for run_id in $(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${sha}&per_page=50" \
              --jq '.workflow_runs[].id'); do
              if gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100" \
                --jq '.jobs[] | select(.conclusion == "success") | .name' \
                | grep -q 'Prerequisites verdict$'; then
                echo "${run_id}"
                return 0
              fi
            done
            return 1
          }

          prerequisites_run=""
          for candidate in "${COMMIT}" "${parent}"; do
            if prerequisites_run="$(find_verdict_run "${candidate}")"; then
              break
            fi
            prerequisites_run=""
          done
          if [ -n "${prerequisites_run}" ]; then
            gh run download "${prerequisites_run}" --repo "${GITHUB_REPOSITORY}" \
              --name assurance-stage-prerequisites --dir assurance-results || true
            echo "prerequisites_run_url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${prerequisites_run}" >> "${GITHUB_ENV}"
          fi

          release_run="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/release.yml/runs?per_page=50" \
            | jq -r --arg tag "${TAG}" '[.workflow_runs[] | select(.head_branch == $tag)][0].id // ""')"
          if [ -n "${release_run}" ]; then
            gh run download "${release_run}" --repo "${GITHUB_REPOSITORY}" \
              --name assurance-stage-pre-release --dir assurance-results || true
            echo "pre_release_run_url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${release_run}" >> "${GITHUB_ENV}"
          fi

      # A release is judged against the catalog that existed when it was made,
      # so a check added later is not counted as missing from an older release.
      - name: Take the catalog from the released tag
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch --quiet origin "refs/tags/${TAG}:refs/tags/${TAG}" || true
          if git show "${TAG}:docs/assurance/catalog.json" > "${RUNNER_TEMP}/catalog.json" 2>/dev/null; then
            echo "catalog=${RUNNER_TEMP}/catalog.json" >> "${GITHUB_ENV}"
          else
            echo "${TAG} predates the assurance catalog; using the one on main."
            echo "catalog=docs/assurance/catalog.json" >> "${GITHUB_ENV}"
          fi

      - name: Build the release report
        id: report
        continue-on-error: true
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -eo pipefail
          go run ./internal/assurance/cmd report \
            --results assurance-results \
            --catalog "${catalog}" --out docs/assurance \
            --tag "${TAG}" \
            --commit '${{ needs.resolve.outputs.commit }}' \
            --url '${{ needs.resolve.outputs.url }}' \
            --published-at '${{ needs.resolve.outputs.published_at }}' \
            --prerequisites-run "${prerequisites_run_url:-}" \
            --pre-release-run "${pre_release_run_url:-}" \
            --assessment-run "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --summary-out "${RUNNER_TEMP}/assurance-summary.md" \
            --step-summary --allow-unknown
          echo "verdict=$(jq -r '.verdict.overall' "docs/assurance/reports/${TAG}.json")" >> "${GITHUB_OUTPUT}"

      - name: Commit the report to main
        if: steps.report.outcome == 'success'
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "${{ steps.app-token.outputs.app-slug }}[bot]"
          git config user.email "${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"
          git add "docs/assurance/reports/${TAG}.json" docs/assurance/index.json
          if git diff --cached --quiet; then
            echo "The report is already committed and unchanged."
            exit 0
          fi
          git commit -m "docs(assurance): release report for ${TAG} [skip ci]"
          # main moves while this runs; rebase onto whatever landed and retry.
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "push attempt ${attempt} failed; rebasing onto origin/main"
            git fetch origin main
            git rebase origin/main
          done
          echo "::error::Could not push the assurance report to main after five attempts."
          exit 1

      - name: Tell the landing page a report is available
        if: steps.report.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          gh api repos/bomly-dev/bomly-landing-page/dispatches \
            --method POST \
            --input - <<EOF
          {"event_type":"bomly-assurance-report","client_payload":{"version":"${TAG}"}}
          EOF

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: assurance-report-${{ needs.resolve.outputs.tag }}
          path: |
            docs/assurance/reports
            docs/assurance/index.json
            assurance-results
          if-no-files-found: warn
          retention-days: 90

      # The release is already public, so a failure here is tracked rather than
      # blocked. One issue per release: opened when something fails, updated on
      # a re-run, and closed when a re-run comes back clean.
      - name: Track the outcome
        if: always() && steps.issue-token.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.issue-token.outputs.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
          VERDICT: ${{ steps.report.outputs.verdict }}
          REPORT_OUTCOME: ${{ steps.report.outcome }}
        run: |
          set -euo pipefail
          title="Release assurance: ${TAG}"
          gh label create release-assurance --color B60205 \
            --description "Post-release assurance findings" --force >/dev/null 2>&1 || true

          existing="$(gh issue list --repo "${GITHUB_REPOSITORY}" --state all \
            --label release-assurance --search "\"${title}\" in:title" \
            --json number,title,state --jq \
            ".[] | select(.title == \"${title}\") | \"\(.number) \(.state)\"" | head -n1)"
          number="${existing%% *}"
          state="${existing##* }"

          body="${RUNNER_TEMP}/assurance-summary.md"
          if [ ! -f "${body}" ]; then
            printf '# %s\n\nThe assessment could not build a report for this release. Open the run for the cause: %s/%s/actions/runs/%s\n' \
              "${title}" "${GITHUB_SERVER_URL}" "${GITHUB_REPOSITORY}" "${GITHUB_RUN_ID}" > "${body}"
          fi

          if [ "${REPORT_OUTCOME}" = "success" ] && [ "${VERDICT}" = "pass" ]; then
            if [ -n "${number}" ] && [ "${state}" = "OPEN" ]; then
              gh issue comment "${number}" --repo "${GITHUB_REPOSITORY}" \
                --body "A later assessment run of ${TAG} passed every check. Closing."
              gh issue close "${number}" --repo "${GITHUB_REPOSITORY}"
            fi
            exit 0
          fi

          if [ -n "${number}" ]; then
            gh issue edit "${number}" --repo "${GITHUB_REPOSITORY}" --body-file "${body}"
            if [ "${state}" != "OPEN" ]; then
              gh issue reopen "${number}" --repo "${GITHUB_REPOSITORY}"
            fi
            gh issue comment "${number}" --repo "${GITHUB_REPOSITORY}" \
              --body "The assessment ran again and still reports problems. See the updated description."
          else
            gh issue create --repo "${GITHUB_REPOSITORY}" --title "${title}" \
              --label release-assurance --body-file "${body}"
          fi

      - name: Fail when the release did not pass
        if: always() && (steps.report.outcome != 'success' || steps.report.outputs.verdict != 'pass')
        run: |
          echo "::error::The post-release assessment did not pass. The release is already public; follow the tracking issue."
          exit 1
