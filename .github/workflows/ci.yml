name: Build & Test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: build-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Run golangci-lint
        # make lint installs the Makefile-pinned golangci-lint and runs it
        # for the root module and every nested component module; the
        # golangci-lint-action's bare root invocation never descends into
        # components/.
        run: make lint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Run unit and integration tests
        run: make test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Build default Bomly binary
        run: go build -o /tmp/bomly ./cmd/bomly
      - name: Build lite Bomly binary
        run: go build -tags "bomly_external_syft,bomly_external_grype" -o /tmp/bomly-lite ./cmd/bomly

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Check Go formatting
        run: make fmt-check

  modules:
    name: Module drift
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Check module metadata drift
        shell: bash
        run: |
          set -euo pipefail
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Check component module metadata drift
        shell: bash
        run: |
          set -euo pipefail
          for modfile in components/*/*/go.mod; do
            [ -e "$modfile" ] || continue
            dir="$(dirname "$modfile")"
            (cd "$dir" && go mod tidy)
          done
          git diff --exit-code -- components/
      - name: Enforce the replace-directive allowlist
        shell: bash
        # The root module intentionally replaces each in-repo component
        # module with its ./components/ directory (documented trade-off:
        # remote `go install ...@latest` is unsupported; install from
        # releases or a clone). Any other replace target in the root, and
        # any replace at all in a component module, is forbidden.
        # `go mod edit -json` sees single-line and block-form directives
        # alike, which a line-oriented grep would miss.
        run: |
          set -euo pipefail
          bad="$(go mod edit -json | jq -r '.Replace[]? | select(.New.Path | startswith("./components/") | not) | .Old.Path')"
          if [ -n "$bad" ]; then
            echo "root go.mod may only replace in-repo ./components/ modules; found: $bad" >&2
            exit 1
          fi
          for modfile in components/*/*/go.mod; do
            [ -e "$modfile" ] || continue
            count="$(go mod edit -json "$modfile" | jq '.Replace | length')"
            if [ "$count" != "0" ] && [ "$count" != "null" ]; then
              echo "$modfile must not contain replace directives" >&2
              exit 1
            fi
          done

  generated-docs:
    name: Generated docs drift
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Regenerate documentation from the built binary
        run: make generate
      - name: Check generated docs drift
        run: git diff --exit-code -- docs/

  docs-links:
    name: Docs link check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check relative links and anchors in Markdown docs
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --include-fragments --no-progress 'docs/**/*.md' README.md CONTRIBUTING.md
          fail: true

  npm-wrapper:
    name: npm wrapper
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test the bomly-mcp launcher and installer
        # No dependencies to install: the package is dependency-free and the
        # tests use node:test. BOMLY_MCP_SKIP_DOWNLOAD keeps CI from pulling a
        # ~90 MB release archive it does not need.
        env:
          BOMLY_MCP_SKIP_DOWNLOAD: "1"
        working-directory: npm
        run: npm test
      - name: Check the packed tarball is installable and self-consistent
        working-directory: npm
        run: |
          set -euo pipefail
          npm pack --dry-run
          node -e '
            const pkg = require("./package.json");
            const server = require("../server.json");
            if (pkg.version !== server.version) {
              throw new Error(`npm/package.json ${pkg.version} != server.json ${server.version}`);
            }
            if (pkg.version !== server.packages[0].version) {
              throw new Error(`npm/package.json ${pkg.version} != server.json package ${server.packages[0].version}`);
            }
            if (pkg.mcpName !== server.name) {
              throw new Error(`mcpName ${pkg.mcpName} != server.json name ${server.name}`);
            }
          '
