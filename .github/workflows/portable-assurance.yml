# Repeated unit tests across supported platforms and cross-builds of every
# release binary. The full suite is repeated by the `portable` job (twice on
# each of three platforms); this job repeats only the Java detector suites,
# which is where intermittent failures have actually appeared. Runs on its own when a maintainer starts it, and as part of
# the "Release prerequisites" stage before a version is tagged.
#
# Every step ends by writing a release assurance check result; the job summary
# is rendered from that same result, so the summary and the report can never
# disagree. Check ids used here must stay declared in docs/assurance/catalog.json.
name: Portable stability assurance

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Commit, branch, or tag to check out.
        type: string
        required: false
        default: ""
      assurance:
        description: Upload release assurance check results.
        type: boolean
        required: false
        default: false
      assurance_tag:
        description: Release tag recorded in the check results.
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  portable:
    name: Portable suite (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Repeat portable suite twice
        id: portable-tests
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          completed=0
          failed=0
          : > "${RUNNER_TEMP}/portable-details.jsonl"
          for iteration in 1 2; do
            echo "portable suite iteration ${iteration}"
            if go test ./... -count=1; then
              completed="${iteration}"
              printf '{"name":"iteration %s","status":"pass"}\n' "${iteration}" \
                >> "${RUNNER_TEMP}/portable-details.jsonl"
            else
              failed="${iteration}"
              printf '{"name":"iteration %s","status":"fail"}\n' "${iteration}" \
                >> "${RUNNER_TEMP}/portable-details.jsonl"
              break
            fi
          done
          echo "completed=${completed}" >> "${GITHUB_OUTPUT}"
          echo "failed=${failed}" >> "${GITHUB_OUTPUT}"
          if [[ "${failed}" != "0" ]]; then
            exit 1
          fi

      - name: Record the platform result
        if: always()
        shell: bash
        env:
          BOMLY_ASSURANCE_TAG: ${{ inputs.assurance_tag }}
          TEST_RESULT: ${{ steps.portable-tests.outcome }}
          COMPLETED: ${{ steps.portable-tests.outputs.completed }}
          FAILED: ${{ steps.portable-tests.outputs.failed }}
        run: |
          set -euo pipefail
          completed="${COMPLETED:-0}"
          failed="${FAILED:-0}"
          exit_code=0
          summary="The complete Go test suite passed twice on ${RUNNER_OS}/${RUNNER_ARCH}, with no reused results."
          if [[ "${TEST_RESULT}" != "success" ]]; then
            exit_code=1
            summary="The complete Go test suite failed on run ${failed} of 2 on ${RUNNER_OS}/${RUNNER_ARCH}. Open the Repeat portable suite twice step for the failing package and test."
          fi
          go run ./internal/assurance/cmd emit \
            --id unit-portable --instance '${{ matrix.os }}' \
            --exit-code "${exit_code}" --summary "${summary}" \
            --metric planned_runs=2 --metric completed_runs="${completed}" \
            --details-jsonl "${RUNNER_TEMP}/portable-details.jsonl" \
            --out assurance-results --step-summary

      - name: Upload check result
        if: always() && inputs.assurance
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: assurance-portable-${{ matrix.os }}
          path: assurance-results
          if-no-files-found: error
          retention-days: 7

      - name: Fail the job when the suite failed
        if: steps.portable-tests.outcome == 'failure'
        shell: bash
        run: exit 1

  linux-stability:
    name: Linux repeated stability
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Repeat Java suites ten times
        id: java-tests
        continue-on-error: true
        run: |
          set -uo pipefail
          completed=0
          failed=0
          : > "${RUNNER_TEMP}/java-details.jsonl"
          for iteration in $(seq 1 10); do
            echo "Java suite iteration ${iteration}"
            if go test ./internal/detectors/gradle ./internal/detectors/maven ./internal/detectors/sbt -count=1; then
              completed="${iteration}"
              printf '{"name":"iteration %s","status":"pass"}\n' "${iteration}" >> "${RUNNER_TEMP}/java-details.jsonl"
            else
              failed="${iteration}"
              printf '{"name":"iteration %s","status":"fail"}\n' "${iteration}" >> "${RUNNER_TEMP}/java-details.jsonl"
              break
            fi
          done
          echo "completed=${completed}" >> "${GITHUB_OUTPUT}"
          echo "failed=${failed}" >> "${GITHUB_OUTPUT}"
          if [[ "${failed}" != "0" ]]; then
            exit 1
          fi

      - name: Record the Java stability result
        if: always()
        env:
          BOMLY_ASSURANCE_TAG: ${{ inputs.assurance_tag }}
          JAVA_RESULT: ${{ steps.java-tests.outcome }}
          COMPLETED: ${{ steps.java-tests.outputs.completed }}
          FAILED: ${{ steps.java-tests.outputs.failed }}
        run: |
          set -euo pipefail
          completed="${COMPLETED:-0}"
          exit_code=0
          summary="The Gradle, Maven, and sbt detector suites passed ten times in a row."
          if [[ "${JAVA_RESULT}" != "success" ]]; then
            exit_code=1
            summary="The Java detector suites failed on run ${FAILED:-0} of 10, which points at an intermittent failure."
          fi
          go run ./internal/assurance/cmd emit \
            --id unit-repeat-java --exit-code "${exit_code}" --summary "${summary}" \
            --metric planned_runs=10 --metric completed_runs="${completed}" \
            --details-jsonl "${RUNNER_TEMP}/java-details.jsonl" \
            --out assurance-results --step-summary

      # Every target is attempted, even after one fails, so the report shows the
      # complete build matrix instead of stopping at the first problem.
      - name: Cross-build release targets
        id: release-builds
        continue-on-error: true
        run: |
          set -uo pipefail
          completed=0
          planned=0
          : > "${RUNNER_TEMP}/build-details.jsonl"
          targets=(
            "linux amd64"
            "linux arm64"
            "darwin amd64"
            "darwin arm64"
            "windows amd64"
            "windows arm64"
          )
          record() {
            printf '{"name":"%s","status":"%s"}\n' "${1}" "${2}" >> "${RUNNER_TEMP}/build-details.jsonl"
          }
          for target in "${targets[@]}"; do
            read -r target_os target_arch <<<"${target}"
            suffix=""
            if [[ "${target_os}" == "windows" ]]; then
              suffix=".exe"
            fi
            for variant in full lite; do
              planned=$((planned + 1))
              echo "cross-build ${target_os}/${target_arch} ${variant}"
              status=fail
              if [[ "${variant}" == "full" ]]; then
                if GOOS="${target_os}" GOARCH="${target_arch}" CGO_ENABLED=0 \
                  go build -o "bin/bomly-${target_os}-${target_arch}${suffix}" ./cmd/bomly; then
                  status=pass
                fi
              else
                if GOOS="${target_os}" GOARCH="${target_arch}" CGO_ENABLED=0 \
                  go build -tags "bomly_external_syft,bomly_external_grype" \
                  -o "bin/bomly-lite-${target_os}-${target_arch}${suffix}" ./cmd/bomly; then
                  status=pass
                fi
              fi
              if [[ "${status}" == "pass" ]]; then
                completed=$((completed + 1))
              fi
              record "${target_os}/${target_arch} ${variant}" "${status}"
            done
          done
          echo "completed=${completed}" >> "${GITHUB_OUTPUT}"
          echo "planned=${planned}" >> "${GITHUB_OUTPUT}"
          if [[ "${completed}" != "${planned}" ]]; then
            exit 1
          fi

      - name: Record the cross-build result
        if: always()
        env:
          BOMLY_ASSURANCE_TAG: ${{ inputs.assurance_tag }}
          BUILD_RESULT: ${{ steps.release-builds.outcome }}
          COMPLETED: ${{ steps.release-builds.outputs.completed }}
          PLANNED: ${{ steps.release-builds.outputs.planned }}
        run: |
          set -euo pipefail
          completed="${COMPLETED:-0}"
          planned="${PLANNED:-12}"
          exit_code=0
          summary="All ${planned} release binaries built: full and lite for Linux, macOS, and Windows on amd64 and arm64."
          if [[ "${BUILD_RESULT}" != "success" ]]; then
            exit_code=1
            summary="${completed} of ${planned} release binaries built. The failed targets are listed below."
          fi
          go run ./internal/assurance/cmd emit \
            --id cross-build --exit-code "${exit_code}" --summary "${summary}" \
            --metric builds_planned="${planned}" --metric builds_completed="${completed}" \
            --details-jsonl "${RUNNER_TEMP}/build-details.jsonl" \
            --out assurance-results --step-summary

      - name: Upload check results
        if: always() && inputs.assurance
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: assurance-linux-stability
          path: assurance-results
          if-no-files-found: error
          retention-days: 7

      - name: Fail the job when any check failed
        if: >-
          steps.java-tests.outcome == 'failure' ||
          steps.release-builds.outcome == 'failure'
        run: exit 1
