# Unit tests across supported platforms and cross-builds of every release
# binary. The `portable` job runs the full suite on three platforms;
# `linux-stability` repeats only the Java detector
# suites, which is where intermittent failures have actually appeared;
# `cross-build` compiles every release target. Runs on its own when a
# maintainer starts it, and as part of the "Release prerequisites" stage
# before a version is tagged.
#
# Every step ends by writing a release assurance check result; the job summary
# is rendered from that same result, so the summary and the report can never
# disagree. Check ids used here must stay declared in docs/assurance/catalog.json.
name: Portable stability assurance

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Commit, branch, or tag to check out.
        type: string
        required: false
        default: ""
      assurance:
        description: Upload release assurance check results.
        type: boolean
        required: false
        default: false
      assurance_tag:
        description: Release tag recorded in the check results.
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  portable:
    name: Portable suite (${{ matrix.os }})
    strategy:
      fail-fast: false
      # One run per platform. The suite used to run twice here so that a pass
      # was never a single lucky run, but the same suite already runs on every
      # pull request and on every push to main, so a test that only passes
      # sometimes shows up there. The
      # repeat made this the slowest job of the release prerequisites stage.
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      # On a cache miss (a changed go.sum, an evicted cache) the suite would
      # download every module inside its one `go test` attempt, where a slow
      # answer from the module proxy fails the release prerequisites stage.
      # Fetching first, with retries, keeps that out of the tests. It only
      # helps because internal/cli pins the module cache in TestMain: before
      # that, tests that redirect HOME did not read the cache this fills.
      - name: Download modules
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if go mod download; then
              exit 0
            fi
            echo "go mod download failed (attempt ${attempt} of 3)"
            sleep 10
          done
          exit 1

      - name: Run the portable suite
        id: portable-tests
        continue-on-error: true
        shell: bash
        run: go test ./... -count=1

      - name: Record the platform result
        if: always()
        shell: bash
        env:
          BOMLY_ASSURANCE_TAG: ${{ inputs.assurance_tag }}
          TEST_RESULT: ${{ steps.portable-tests.outcome }}
        run: |
          set -euo pipefail
          exit_code=0
          summary="The complete Go test suite passed on ${RUNNER_OS}/${RUNNER_ARCH}, with no reused results."
          if [[ "${TEST_RESULT}" != "success" ]]; then
            exit_code=1
            summary="The complete Go test suite failed on ${RUNNER_OS}/${RUNNER_ARCH}. Open the Run the portable suite step for the failing package and test."
          fi
          go run ./internal/assurance/cmd emit \
            --id unit-portable --instance '${{ matrix.os }}' \
            --exit-code "${exit_code}" --summary "${summary}" \
            --out assurance-results --step-summary

      - name: Upload check result
        if: always() && inputs.assurance
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: assurance-portable-${{ matrix.os }}
          path: assurance-results
          if-no-files-found: error
          retention-days: 7

      - name: Fail the job when the suite failed
        if: steps.portable-tests.outcome == 'failure'
        shell: bash
        run: exit 1

  linux-stability:
    name: Linux repeated stability
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Repeat Java suites ten times
        id: java-tests
        continue-on-error: true
        run: |
          set -uo pipefail
          completed=0
          failed=0
          : > "${RUNNER_TEMP}/java-details.jsonl"
          for iteration in $(seq 1 10); do
            echo "Java suite iteration ${iteration}"
            if go test ./internal/detectors/gradle ./internal/detectors/maven ./internal/detectors/sbt -count=1; then
              completed="${iteration}"
              printf '{"name":"iteration %s","status":"pass"}\n' "${iteration}" >> "${RUNNER_TEMP}/java-details.jsonl"
            else
              failed="${iteration}"
              printf '{"name":"iteration %s","status":"fail"}\n' "${iteration}" >> "${RUNNER_TEMP}/java-details.jsonl"
              break
            fi
          done
          echo "completed=${completed}" >> "${GITHUB_OUTPUT}"
          echo "failed=${failed}" >> "${GITHUB_OUTPUT}"
          if [[ "${failed}" != "0" ]]; then
            exit 1
          fi

      - name: Record the Java stability result
        if: always()
        env:
          BOMLY_ASSURANCE_TAG: ${{ inputs.assurance_tag }}
          JAVA_RESULT: ${{ steps.java-tests.outcome }}
          COMPLETED: ${{ steps.java-tests.outputs.completed }}
          FAILED: ${{ steps.java-tests.outputs.failed }}
        run: |
          set -euo pipefail
          completed="${COMPLETED:-0}"
          exit_code=0
          summary="The Gradle, Maven, and sbt detector suites passed ten times in a row."
          if [[ "${JAVA_RESULT}" != "success" ]]; then
            exit_code=1
            summary="The Java detector suites failed on run ${FAILED:-0} of 10, which points at an intermittent failure."
          fi
          go run ./internal/assurance/cmd emit \
            --id unit-repeat-java --exit-code "${exit_code}" --summary "${summary}" \
            --metric planned_runs=10 --metric completed_runs="${completed}" \
            --details-jsonl "${RUNNER_TEMP}/java-details.jsonl" \
            --out assurance-results --step-summary

      - name: Upload check results
        if: always() && inputs.assurance
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: assurance-linux-stability
          path: assurance-results
          if-no-files-found: error
          retention-days: 7

      - name: Fail the job when the Java suites failed
        if: steps.java-tests.outcome == 'failure'
        run: exit 1

  # One job per target operating system. The twelve builds used to run one
  # after another inside `linux-stability` and took eleven minutes, which made
  # that job one of the slowest in the release prerequisites stage.
  cross-build:
    name: Cross-build (${{ matrix.target_os }})
    strategy:
      fail-fast: false
      matrix:
        target_os: [linux, darwin, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      # Every target is attempted, even after one fails, so the report shows the
      # complete build matrix instead of stopping at the first problem. The
      # flags are the ones .goreleaser.yaml builds a release with.
      - name: Cross-build release targets
        id: release-builds
        continue-on-error: true
        env:
          TARGET_OS: ${{ matrix.target_os }}
        run: |
          set -uo pipefail
          completed=0
          planned=0
          : > "${RUNNER_TEMP}/build-details.jsonl"
          record() {
            printf '{"name":"%s","status":"%s"}\n' "${1}" "${2}" >> "${RUNNER_TEMP}/build-details.jsonl"
          }
          suffix=""
          if [[ "${TARGET_OS}" == "windows" ]]; then
            suffix=".exe"
          fi
          for target_arch in amd64 arm64; do
            for variant in full lite; do
              planned=$((planned + 1))
              echo "cross-build ${TARGET_OS}/${target_arch} ${variant}"
              status=fail
              if [[ "${variant}" == "full" ]]; then
                if GOOS="${TARGET_OS}" GOARCH="${target_arch}" CGO_ENABLED=0 \
                  go build -trimpath -o "bin/bomly-${TARGET_OS}-${target_arch}${suffix}" ./cmd/bomly; then
                  status=pass
                fi
              else
                if GOOS="${TARGET_OS}" GOARCH="${target_arch}" CGO_ENABLED=0 \
                  go build -trimpath -tags "bomly_external_syft,bomly_external_grype" \
                  -o "bin/bomly-lite-${TARGET_OS}-${target_arch}${suffix}" ./cmd/bomly; then
                  status=pass
                fi
              fi
              if [[ "${status}" == "pass" ]]; then
                completed=$((completed + 1))
              fi
              record "${TARGET_OS}/${target_arch} ${variant}" "${status}"
            done
          done
          echo "completed=${completed}" >> "${GITHUB_OUTPUT}"
          echo "planned=${planned}" >> "${GITHUB_OUTPUT}"
          if [[ "${completed}" != "${planned}" ]]; then
            exit 1
          fi

      - name: Record the cross-build result
        if: always()
        env:
          BOMLY_ASSURANCE_TAG: ${{ inputs.assurance_tag }}
          TARGET_OS: ${{ matrix.target_os }}
          BUILD_RESULT: ${{ steps.release-builds.outcome }}
          COMPLETED: ${{ steps.release-builds.outputs.completed }}
          PLANNED: ${{ steps.release-builds.outputs.planned }}
        run: |
          set -euo pipefail
          completed="${COMPLETED:-0}"
          planned="${PLANNED:-4}"
          exit_code=0
          summary="All ${planned} ${TARGET_OS} release binaries built: full and lite on amd64 and arm64."
          if [[ "${BUILD_RESULT}" != "success" ]]; then
            exit_code=1
            summary="${completed} of ${planned} ${TARGET_OS} release binaries built. The failed targets are listed below."
          fi
          go run ./internal/assurance/cmd emit \
            --id cross-build --instance "${TARGET_OS}" \
            --exit-code "${exit_code}" --summary "${summary}" \
            --metric builds_planned="${planned}" --metric builds_completed="${completed}" \
            --details-jsonl "${RUNNER_TEMP}/build-details.jsonl" \
            --out assurance-results --step-summary

      - name: Upload check result
        if: always() && inputs.assurance
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: assurance-cross-build-${{ matrix.target_os }}
          path: assurance-results
          if-no-files-found: error
          retention-days: 7

      - name: Fail the job when a build failed
        if: steps.release-builds.outcome == 'failure'
        run: exit 1
