# Generates canonical SBOMs — one pair from a single fixture, one pair merged
# from two source documents — and validates all four with the official SPDX
# and CycloneDX tools, pinned by checksum. The merged pair is also checked for
# the ADR-0042 rule that a merge links its sources instead of adopting one's
# identity.
#
# It runs where a failure can still be fixed by an ordinary change: on pull
# requests that touch what decides SBOM output, and in the release
# prerequisites stage before a version is tagged. It used to run after
# publication and on a weekly schedule. The first caught an invalid merged
# SPDX export only once the release was public, and the second had been failing
# on it for three weeks without anyone being told -- a failed scheduled run
# notifies no one.
#
# The download, generation, and validation logic lives in
# internal/assurance/sbominterop, which records every command, exit code, and
# checksum in a bomly.sbom-assurance-run/v1 manifest. This workflow only
# arranges the inputs and turns that manifest into a check result.
name: SBOM interoperability assurance

on:
  pull_request:
    # What can change the documents Bomly writes: the pinned SDK, which owns
    # the SBOM codec, the detector and command code around it, the inputs, and
    # this check itself.
    paths:
      - go.mod
      - go.sum
      - internal/detectors/sbom/**
      - internal/cli/**
      - internal/output/**
      - internal/assurance/sbominterop/**
      - test/smoke/testdata/sboms/**
      - .github/workflows/sbom-interoperability.yml
  workflow_dispatch:
  # Called by "Release prerequisites" (assurance-prerequisites.yml).
  workflow_call:
    inputs:
      ref:
        description: Commit, branch, or tag to check out.
        type: string
        required: false
        default: ""
      assurance:
        description: Upload a release assurance check result.
        type: boolean
        required: false
        default: false
      assurance_tag:
        description: Release tag recorded in the check result.
        type: string
        required: false
        default: ""

# A newer push to a pull request supersedes the run in progress. Nothing else
# is cancelled: when this is called by the release prerequisites stage,
# `github.workflow` is the caller's name, so a manual run cannot share a group
# with it and knock a gate out of a release.
concurrency:
  group: sbom-interoperability-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  FIXTURE_SBOM: test/smoke/testdata/sboms/go.spdx.json
  MERGE_FIXTURE_A: test/smoke/testdata/sboms/go.spdx.json
  MERGE_FIXTURE_B: test/smoke/testdata/sboms/js.spdx.json
  OUTPUT_DIR: sbom-assurance-artifacts

jobs:
  validate:
    name: Validate generated SBOMs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Build the Bomly binary
        run: make build-full

      - name: Generate and validate SBOMs
        id: sbom
        continue-on-error: true
        run: |
          go run ./internal/assurance/sbominterop \
            -bomly ./bin/bomly -input "${FIXTURE_SBOM}" \
            -merge-a "${MERGE_FIXTURE_A}" -merge-b "${MERGE_FIXTURE_B}" \
            -output "${OUTPUT_DIR}"

      - name: Record the interoperability result
        if: always()
        env:
          BOMLY_ASSURANCE_TAG: ${{ inputs.assurance_tag }}
        run: |
          set -euo pipefail
          manifest="${OUTPUT_DIR}/run-manifest.json"
          if [ -f "${manifest}" ]; then
            go run ./internal/assurance/cmd convert sbom-assurance \
              --id sbom-interoperability --input "${manifest}" \
              --out assurance-results --step-summary
          else
            go run ./internal/assurance/cmd emit \
              --id sbom-interoperability --status fail \
              --summary "The SBOM interoperability run stopped before it could write a manifest. Open the generate step for the cause." \
              --out assurance-results --step-summary
          fi

      - name: Upload check result
        if: always() && inputs.assurance
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: assurance-sbom-interoperability
          path: assurance-results
          if-no-files-found: error
          retention-days: 30

      - name: Upload assurance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-interoperability-${{ github.run_id }}
          path: |
            sbom-assurance-artifacts/bomly.spdx.json
            sbom-assurance-artifacts/bomly.cdx.json
            sbom-assurance-artifacts/bomly-merged.spdx.json
            sbom-assurance-artifacts/bomly-merged.cdx.json
            sbom-assurance-artifacts/run-manifest.json
          if-no-files-found: warn
          retention-days: 14

      - name: Fail the job when validation failed
        if: steps.sbom.outcome == 'failure'
        run: exit 1
