# Generates canonical SBOMs and validates them with the official SPDX and
# CycloneDX tools, pinned by checksum. Runs weekly on its own, and as part of
# the post-release assessment against the binary the release actually shipped.
#
# The download, generation, and validation logic lives in
# internal/assurance/sbominterop, which records every command, exit code, and
# checksum in a bomly.sbom-assurance-run/v1 manifest. This workflow only
# arranges the inputs and turns that manifest into a check result.
name: SBOM interoperability assurance

on:
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Commit, branch, or tag to check out.
        type: string
        required: false
        default: ""
      release_tag:
        description: Validate the binary published for this release tag instead of a freshly built one.
        type: string
        required: false
        default: ""
      assurance:
        description: Upload a release assurance check result.
        type: boolean
        required: false
        default: false

permissions:
  contents: read

env:
  FIXTURE_SBOM: test/smoke/testdata/sboms/go.spdx.json
  OUTPUT_DIR: sbom-assurance-artifacts

jobs:
  validate:
    name: Validate generated SBOMs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Build the Bomly binary
        if: inputs.release_tag == ''
        run: make build-full

      # The post-release assessment validates what users downloaded, not a
      # rebuild of it, so the released archive is verified against the published
      # checksum list before it is used.
      - name: Download the released binary
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          archive="bomly_${version}_linux_amd64.tar.gz"
          mkdir -p "${RUNNER_TEMP}/release" bin
          gh release download "${RELEASE_TAG}" --repo bomly-dev/bomly-cli \
            --pattern "${archive}" --pattern SHA256SUMS --dir "${RUNNER_TEMP}/release"
          (cd "${RUNNER_TEMP}/release" && sha256sum --check --ignore-missing SHA256SUMS)
          tar -xzf "${RUNNER_TEMP}/release/${archive}" -C "${RUNNER_TEMP}/release" bomly
          install -m 0755 "${RUNNER_TEMP}/release/bomly" bin/bomly
          ./bin/bomly version

      - name: Generate and validate SBOMs
        id: sbom
        continue-on-error: true
        run: |
          go run ./internal/assurance/sbominterop \
            -bomly ./bin/bomly -input "${FIXTURE_SBOM}" -output "${OUTPUT_DIR}"

      - name: Record the interoperability result
        if: always()
        env:
          BOMLY_ASSURANCE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          manifest="${OUTPUT_DIR}/run-manifest.json"
          if [ -f "${manifest}" ]; then
            go run ./internal/assurance/cmd convert sbom-assurance \
              --id sbom-interoperability --input "${manifest}" \
              --out assurance-results --step-summary
          else
            go run ./internal/assurance/cmd emit \
              --id sbom-interoperability --status fail \
              --summary "The SBOM interoperability run stopped before it could write a manifest. Open the generate step for the cause." \
              --out assurance-results --step-summary
          fi

      - name: Upload check result
        if: always() && inputs.assurance
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: assurance-sbom-interoperability
          path: assurance-results
          if-no-files-found: error
          retention-days: 30

      - name: Upload assurance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-interoperability-${{ github.run_id }}
          path: |
            sbom-assurance-artifacts/bomly.spdx.json
            sbom-assurance-artifacts/bomly.cdx.json
            sbom-assurance-artifacts/run-manifest.json
          if-no-files-found: warn
          retention-days: 14

      - name: Fail the job when validation failed
        if: steps.sbom.outcome == 'failure'
        run: exit 1
